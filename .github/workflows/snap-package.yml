name: Snap Package

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: snap-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snap:
    name: Build snap
    # Pin 24.04 so the host runner does not drift away from the core24 target base.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build snap from manifest
        id: snapcraft
        uses: snapcore/action-build@v1
        with:
          path: packaging/snap

      - name: Attach Snap package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.snapcraft.outputs.snap }}
