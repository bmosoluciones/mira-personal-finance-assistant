site_name: MIRA - User Manual
site_description: User documentation for MIRA, an offline personal finance assistant.
repo_name: bmosoluciones/mira-personal-finance-assistant
repo_url: https://github.com/bmosoluciones/mira-personal-finance-assistant

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: images/mira-nav-logo.svg
  favicon: images/mira.ico
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: MIRA - User Manual
          site_description: User documentation for MIRA, an offline personal finance assistant.
          theme:
            language: en
        - locale: es
          name: Espanol
          build: true
          site_name: MIRA - Manual de Usuario
          site_description: Manual de uso de MIRA, asistente de finanzas personales offline.
          theme:
            language: es
          nav_translations:
            Home: Inicio
            Installation and Launch: Instalacion y Arranque
            First Steps: Primeros Pasos
            Interface Guide: Guia de la Interfaz
            Practical Workflows: Flujos Practicos
            Income-Expense Category Associations: Asociacion de Categorias
            Credit Cards: Tarjetas de Credito
            Account Reconciliation: Conciliacion de Cuentas
            MIRA Analysis: Analisis MIRA
            Natural Language: Lenguaje Natural
            Import, Export and Backup: Importacion, Exportacion y Respaldo
            Optional Local AI: IA Local Opcional
            Troubleshooting: Solucion de Problemas
            FAQ: Preguntas Frecuentes
            Appendices: Anexos
            AI JSON Contract: Contrato JSON IA
            Manual Linux install (hidden venv): Instalacion manual en Linux (venv oculto)
            Portable Windows .zip (advanced): Windows portable .zip (avanzado)
            Remote GUI over SSH (X11): GUI remota sobre SSH (X11)

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  install_links:
    # Public download URLs shown on the custom home page when provided.
    exe: "https://mira.bmogroup.solutions/releases/mira_personal_finance_assistant-0.0.1b5.exe"
    zip: "https://mira.bmogroup.solutions/releases/mira_personal_finance_assistant-0.0.1b5.zip"
    flatpak: "https://github.com/bmosoluciones/solutions.bmogroup.mira"
    snap: "https://github.com/bmosoluciones/mira-personal-finance-assistant/blob/main/packaging/snap/snapcraft.yaml"

nav:
  - Home: index.md
  - Installation and Launch: installation.md
  - First Steps: first_steps.md
  - Interface Guide: interface_guide.md
  - Practical Workflows: practical_workflows.md
  - Income-Expense Category Associations: income_expense_relations.md
  - Credit Cards: credit_cards.md
  - Account Reconciliation: reconciliation.md
  - MIRA Analysis: mira_analysis.md
  - Natural Language: natural_language.md
  - Import, Export and Backup: import_export_backup.md
  - Optional Local AI: optional_local_ai.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Appendices:
      - AI JSON Contract: ai_json_contract.md
      - Manual Linux install (hidden venv): manual_install_hidden_venv_linux.md
      - Portable Windows .zip (advanced): portable_windows_zip_advanced.md
      - Remote GUI over SSH (X11): remote_gui_ssh_x11.md
