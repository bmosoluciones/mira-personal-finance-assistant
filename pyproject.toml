[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mira-personal-finance-assistant"
version = "0.0.1b2"
description = "MIRA – Manage Income & Resources Allocations. Personal Finance Assistant."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "et-xmlfile==2.0.0",
    "jinja2==3.1.6",
    "MarkupSafe==2.1.5",
    "openpyxl==3.1.5",
    "peewee==4.0.2",
    "PySide6==6.10.2",
    "qt-material==2.14",
]

[project.optional-dependencies]
chat = [
    "llama-cpp-python==0.2.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocs-static-i18n>=1.3.0",
]

dev = [
    "build",
    "wheel",
    "openpyxl==3.1.5",
    "pytest",
    "pytest-cov",
    "flake8",
    "ruff",
    "black",
    "mypy",
    "pyinstaller",
    "types-peewee",
    "openpyxl-stubs",
    "types-openpyxl",
    "qt_material-stubs",
    "pydocstyle",
]

[project.scripts]
mira-cli = "mira.cli:main"

[project.gui-scripts]
mira = "mira.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mira"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "use-symbolic-message-instead",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "protected-access",
    "line-too-long",
    "import-outside-toplevel",
    "no-name-in-module",
    "attribute-defined-outside-init",
    "invalid-name",
    "wrong-import-position",
    "broad-exception-caught",
    "disallowed-name",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "too-many-positional-arguments",
    "too-many-lines",
    "too-many-statements",
    "duplicate-code",
    "no-member",
    "too-many-branches",
    "too-many-ancestors",
    "too-many-return-statements",
    "unnecessary-ellipsis"

]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m \"not full\" --cov=src --cov-report=term --cov-report=html"
markers = [
    "full: long-running tests for complete validation",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/mira/ui/*.py", "src/mira/ui/**/*.py"]

[tool.coverage.report]
omit = ["src/mira/ui/*.py", "src/mira/ui/**/*.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
# MainWindow mixin files reference attributes defined in the composed MainWindow
# class. This is a known mypy limitation with the mixin pattern and all
# attr-defined errors in these files are intentional by design.
module = [
    "mira.ui.main_window_layout",
    "mira.ui.main_window_lifecycle",
    "mira.ui.main_window_prompt",
    "mira.ui.main_window_navigation",
    "mira.ui.main_window_shell",
]
disable_error_code = ["attr-defined", "arg-type", "misc", "has-type", "union-attr", "call-overload"]
