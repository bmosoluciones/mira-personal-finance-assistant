[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mira-personal-finance-assistant"
version = "0.0.1a2"
description = "MIRA – Manage Income & Resources Allocations. Personal Finance Assistant."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "et-xmlfile==2.0.0",
    "jinja2==3.1.6",
    "MarkupSafe==2.1.5",
    "openpyxl==3.1.5",
    "peewee==4.0.2",
    "PySide6==6.10.2",
    "qt-material==2.14",
]

[project.optional-dependencies]
chat = [
    "llama-cpp-python==0.2.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocs-static-i18n>=1.3.0",
]

dev = [
    "build",
    "wheel",
    "pytest",
    "pytest-cov",
    "flake8",
    "ruff",
    "black",
    "pyinstaller",
]

[project.scripts]
mira-cli = "mira.cli:main"

[project.gui-scripts]
mira = "mira.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mira"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "use-symbolic-message-instead",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "protected-access",
    "line-too-long",
    "import-outside-toplevel",
    "no-name-in-module",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m \"not full\""
markers = [
    "full: long-running tests for complete validation",
]
