name: mira-personal-finance-assistant
title: MIRA
base: core24
version: 0.0.1b6
summary: Offline personal finance assistant
description: |
  MIRA is a desktop application for personal finance management that keeps
  data local.

  Track income and expenses, organize accounts, categories, budgets, and
  savings goals, and review reports without sending financial data to
  external services.

  Local network access is only used when the user explicitly starts mobile
  sync from the desktop menu.
grade: stable
confinement: strict
license: GPL-3.0-or-later
source-code: https://github.com/bmosoluciones/mira-personal-finance-assistant
website: https://mira.bmogroup.solutions
issues: https://github.com/bmosoluciones/mira-personal-finance-assistant/issues
contact: development@bmogroup.solutions
icon: 256x256.png

apps:
  mira:
    command: local/bin/mira
    extensions:
      - kde-neon-6
    common-id: solutions.bmogroup.mira.desktop
    desktop: usr/share/applications/solutions.bmogroup.mira.desktop
    plugs:
      - home
      - network
      - network-bind
      - opengl
    environment:
      MIRA_MODELS_DIR: $SNAP_USER_COMMON/.mira/models
      PYTHONPATH: $SNAP/local/lib/python3.12/dist-packages:$SNAP/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}
      XDG_DATA_HOME: $SNAP_USER_COMMON/.local/share

parts:
  metadata:
    plugin: dump
    source: .
    source-type: local
    organize:
      256x256.png: usr/share/icons/hicolor/256x256/apps/solutions.bmogroup.mira.png
      scalable.svg: usr/share/icons/hicolor/scalable/apps/solutions.bmogroup.mira.svg
      solutions.bmogroup.mira.desktop: usr/share/applications/solutions.bmogroup.mira.desktop
      solutions.bmogroup.mira.metainfo.xml: usr/share/metainfo/solutions.bmogroup.mira.metainfo.xml
    prime:
      - usr/share/icons/hicolor/256x256/apps/solutions.bmogroup.mira.png
      - usr/share/icons/hicolor/scalable/apps/solutions.bmogroup.mira.svg
      - usr/share/applications/solutions.bmogroup.mira.desktop
      - usr/share/metainfo/solutions.bmogroup.mira.metainfo.xml

  mira:
    after:
      - metadata
    plugin: nil
    source: https://mira.bmogroup.solutions/releases/mira_personal_finance_assistant-0.0.1b6-py3-none-any.whl
    source-type: file
    source-checksum: sha256/c8da7506990a15b2615565fa537e8768e25adccdef4cebff63315e84d070f1eb
    build-snaps:
      - kde-pyside6-core24-sdk/latest/stable
    stage-snaps:
      - kde-pyside6-core24-sdk/latest/stable
    build-packages:
      - python3-pip
    override-build: |
      python3 -m pip install --no-deps --prefix=$CRAFT_PART_INSTALL $CRAFT_PART_SRC/mira_personal_finance_assistant-0.0.1b6-py3-none-any.whl
      # PySide6 is provided by the kde-neon-6 extension/runtime and is not installed via pip here.
      python3 -m pip install --no-deps --prefix=$CRAFT_PART_INSTALL \
        cryptography==46.0.7 \
        cffi==2.0.0 \
        et-xmlfile==2.0.0 \
        ifaddr==0.2.0 \
        jinja2==3.1.6 \
        MarkupSafe==2.1.5 \
        openpyxl==3.1.5 \
        peewee==4.0.2 \
        pycparser==3.0 \
        qt-material==2.14 \
        segno==1.6.6 \
        zeroconf==0.148.0
    prime:
      - -bin/pip
      - -bin/pip3
      - -bin/pip3.12
      - -include
      - -share/doc
      - -share/man
      - -usr/include
      - -usr/lib/*/cmake
